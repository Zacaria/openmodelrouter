name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Setup Node for the pinned provider adapter
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Build pi-ai transport (synthetic tests; no credentials)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r desktop/sidecar-requirements.txt
          npm ci --prefix desktop/provider-runtime --no-audit --no-fund
          npm run check --prefix desktop/provider-runtime
          npm run build --prefix desktop/provider-runtime
      - name: Standard-library regression tests (synthetic backends)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -eu
          for suite in . pilot-t_f21a25b3 loop-t_daf181c7 comparator-t_14313d5b integrated-t_dab1958b demo-t_a3c46d97; do
            (cd "$suite" && python -B -m unittest discover -v)
          done
          python -B host-adapters/test_launch.py
          python -B tests/test_landing.py
      - name: Check whitespace
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^
          else
            git diff-tree --root --check HEAD
          fi
