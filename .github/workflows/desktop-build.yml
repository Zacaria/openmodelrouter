name: Desktop native build candidates

on:
  workflow_dispatch:
    inputs:
      existing_quota_confirmed:
        description: 'Release owner checked existing Actions quota; no additional billing authorised'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: inputs.existing_quota_confirmed
    name: ${{ matrix.target }} (build candidate)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
    steps:
      - name: Checkout exact dispatched composition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'

      - name: Setup native Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.91.1
          rustc -vV

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2

      - name: Verify composed app contract and native architecture
        run: python ci/desktop.py contract --target "$TARGET"

      - name: Install locked build dependencies
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix provider-runtime --no-audit --no-fund
          npm run check --prefix provider-runtime
          python -m pip install --require-hashes --only-binary=:all: -r sidecar-requirements.txt

      - name: Frontend checks
        working-directory: desktop
        run: |
          set -euo pipefail
          npm run check
          npm test
          npm run format:check
          npm run build

      - name: Python desktop and CI regressions (synthetic only)
        run: python -B -m unittest test_desktop test_desktop_security test_desktop_ci -v

      - name: Freeze native Python engine
        run: python desktop/scripts/build_sidecar.py

      - name: Exercise real pi-ai adapters and the frozen transport without runtimes on PATH
        run: |
          set -euo pipefail
          suffix=''
          if [ "${{ runner.os }}" = Windows ]; then suffix='.exe'; fi
          export OMR_TEST_ENGINE="desktop/src-tauri/binaries/omr-engine-$TARGET$suffix"
          python -B -m unittest test_pi_ai test_pi_ai_packaged -v

      - name: Rust format, tests and lint
        working-directory: desktop
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target "$TARGET"
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Build frontend and native bundles without release credentials
        working-directory: desktop
        env:
          CARGO_NET_OFFLINE: 'true'
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = macOS ]; then
            npm run native:build -- --ci --target "$TARGET" --bundles "$BUNDLES" --config '{"bundle":{"macOS":{"hardenedRuntime":false}}}'
          else
            npm run native:build -- --ci --target "$TARGET" --bundles "$BUNDLES"
          fi

      - name: Real linuxdeploy sidecar identity regression
        if: runner.os == 'Linux'
        run: python ci/test_linuxdeploy.py --sidecar "desktop/src-tauri/binaries/omr-engine-$TARGET"

      - name: Verify packaged sidecars and create checksummed candidates
        run: python ci/desktop.py collect --target "$TARGET" --output "dist/desktop-$TARGET"

      - name: Upload only verified candidate packages and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omr-desktop-${{ matrix.target }}-${{ github.sha }}
          path: dist/desktop-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
